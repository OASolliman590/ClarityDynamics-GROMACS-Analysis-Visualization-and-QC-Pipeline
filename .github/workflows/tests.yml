name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test and interface extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff) - maintained modules
        run: >
          ruff check gromacs_analysis/setup gromacs_analysis/utils/convergence.py
          gromacs_analysis/utils/provenance.py gromacs_analysis/ranking/stats.py gromacs_analysis/pipeline/cache.py
          tests/test_setup_scanner.py tests/test_setup_project.py tests/test_setup_tui.py tests/test_setup_runs.py
          tests/test_convergence_stats.py tests/test_cache_provenance.py tests/setup_fixtures.py
      - name: Type check (mypy) - setup package
        run: mypy
      - name: Tests with coverage
        run: pytest -q --cov=gromacs_analysis --cov-report=term --cov-fail-under=50
